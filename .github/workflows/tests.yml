name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest
      - run: pip install networkx scipy pandas polars ipython nbclient nbformat ipykernel && pytest
      - name: Real Spark (Java is preinstalled on the runner)
        if: matrix.python == '3.11'
        run: pip install pyspark && pytest tests/test_spark.py -rs
