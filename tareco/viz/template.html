<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>/*STYLE*/</style>
</head>
<body>
<div id="graph"></div>

<div class="card header">
  <div class="title-row">
    <h1 id="title"></h1>
    <span id="counts" class="muted"></span>
  </div>
  <div class="search">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search nodes">
    <kbd>/</kbd>
    <ul id="results" hidden></ul>
  </div>
  <div class="toolbar">
    <button id="btn-fit" data-tip="Fit to screen" aria-label="Fit to screen">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
    </button>
    <button id="btn-labels" class="on" data-tip="Labels" aria-label="Toggle labels">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
    </button>
    <button id="btn-physics" data-tip="Freeze layout" aria-label="Freeze layout">
      <svg class="icon i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg class="icon i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>
    </button>
    <button id="btn-path" data-tip="Shortest path: click two nodes" aria-label="Shortest path mode">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg>
    </button>
    <button id="btn-groups" data-tip="Groups overview" aria-label="Groups overview" hidden>
      <svg class="icon" viewBox="0 0 24 24"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><circle cx="12" cy="17" r="3"/></svg>
    </button>
    <button id="btn-review" data-tip="Worth a look" aria-label="Worth a look" hidden>
      <svg class="icon" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
    </button>
    <button id="btn-insights" data-tip="Insights" aria-label="Insights" hidden>
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
    </button>
    <button id="btn-theme" data-tip="Theme" aria-label="Toggle theme">
      <svg class="icon i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
    <button id="btn-png" data-tip="Save image" aria-label="Save image">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button>
  </div>
  <div id="crumb" hidden>
    <button id="crumb-back" class="ghost" data-tip="All groups" aria-label="Back to all groups">
      <svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <span id="crumb-dot" class="dot"></span>
    <span id="crumb-name"></span>
    <span id="crumb-count" class="muted"></span>
  </div>
</div>

<div id="legend" class="card" hidden></div>

<div id="timebar" class="card" hidden>
  <button id="time-play" aria-label="Play">
    <svg class="icon i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>
    <svg class="icon i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
  <input id="time-range" type="range" min="0" max="0" step="1" aria-label="Period">
  <span id="time-label"></span>
</div>

<aside id="panel" class="card" hidden>
  <div class="panel-head">
    <span id="panel-dot" class="dot"></span>
    <h2 id="panel-title"></h2>
    <button id="btn-pin" class="ghost" data-tip="Pin in place" aria-label="Pin node">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg>
    </button>
    <button id="btn-close" class="ghost" aria-label="Close">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="panel-body"></div>
</aside>

<div id="toast" hidden></div>

<!--LIB-->
<script>/*DATA*/</script>
<script>/*APP*/</script>
</body>
</html>
